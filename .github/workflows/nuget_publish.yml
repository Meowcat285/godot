name: 📦 NuGet packages
on:
  workflow_call:
    inputs:
      release-name:
        description: The release name, used as the version of the packages (e.g. 2026.10.8).
        type: string
        required: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    name: Publish NuGet packages
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      # Read by build_assemblies.py. The release name never collides with upstream's 4.x versions.
      GODOT_NUPKG_VERSION: ${{ inputs.release-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Linux editor
        uses: actions/download-artifact@v8
        with:
          name: linux-editor-mono
          path: linux-editor-mono

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.100

      # Link the packages to this repository on GitHub Packages, instead of upstream's.
      - name: Point package metadata to this repository
        run: |
          sed -i "s|<RepositoryUrl>.*</RepositoryUrl>|<RepositoryUrl>${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}</RepositoryUrl>|" \
            $(grep -rl "<RepositoryUrl>" modules/mono --include=*.csproj)

      - name: Generate C# glue
        run: |
          mkdir -p bin
          cp linux-editor-mono/godot.linuxbsd.editor.x86_64.mono bin/
          chmod +x bin/godot.linuxbsd.editor.x86_64.mono
          bin/godot.linuxbsd.editor.x86_64.mono --headless --generate-mono-glue ./modules/mono/glue

      - name: Build NuGet packages
        run: |
          ./modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin --godot-platform=linuxbsd \
            --push-nupkgs-local=./nupkgs
          ls -l nupkgs

      # Only the packages versioned after the release (GodotSharp, GodotSharpEditor, Godot.NET.Sdk, Godot.SourceGenerators).
      # `--skip-duplicate` keeps re-runs from failing, as GitHub Packages doesn't allow overwriting a version.
      - name: Publish to GitHub Packages
        env:
          NUGET_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          packages=(nupkgs/*."${GODOT_NUPKG_VERSION}".nupkg)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::No NuGet packages found for version ${GODOT_NUPKG_VERSION}."
            exit 1
          fi
          for package in "${packages[@]}"; do
            dotnet nuget push "${package}" --source "${NUGET_SOURCE}" --api-key "${GH_TOKEN}" --skip-duplicate
          done
          ls -1 "${packages[@]}"
