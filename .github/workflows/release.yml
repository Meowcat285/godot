name: 📦 Release
on:
  workflow_call:
    inputs:
      release-name:
        description: The name (and tag) of the release, from the `release-name` job in runner.yml.
        type: string
        required: true
      prerelease:
        description: Publish a pre-release, for builds of branches other than the default one.
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-24.04
    name: Publish release
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The full history (without file contents) and tags, to list the commits since the previous release.
          fetch-depth: 0
          filter: tree:0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package release assets
        run: |
          ls -R artifacts | head -n 200
          python3 ./misc/scripts/package_release.py --artifacts artifacts --output release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ inputs.release-name }}
          PRERELEASE: ${{ inputs.prerelease }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          cat > release-notes.md << EOF
          Automated build of commit ${GITHUB_SHA} (\`${GITHUB_REF_NAME}\`).

          - **Export templates:** download them from the editor via **Editor > Manage Export Templates**, or install the \`.tpz\` file manually.
          - **C# projects:** the editor bundles the \`GodotSharp\`, \`GodotSharpEditor\`, \`Godot.NET.Sdk\` and \`Godot.SourceGenerators\` packages as version \`${RELEASE_NAME}\`, sets new and opened projects to it, and registers them with NuGet.
          - **Workflow run:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          prerelease_flags=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            prerelease_flags=(--prerelease --latest=false)
            echo "- **Pre-release:** the macOS editor is signed but not notarized, so macOS asks for confirmation before opening it the first time." >> release-notes.md
          fi
          # Releases list the commits since the previous release, pre-releases the commits of their branch.
          if [[ "${PRERELEASE}" == "true" ]]; then
            base="origin/${DEFAULT_BRANCH}"
            compare="${DEFAULT_BRANCH}...${GITHUB_SHA}"
            heading="Commits in \`${GITHUB_REF_NAME}\`"
          else
            base="$(gh release list --repo "${GITHUB_REPOSITORY}" --exclude-pre-releases --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')"
            compare="${base}...${GITHUB_SHA}"
            heading="Commits since ${base}"
          fi
          # Skipped for the first release, and if the base is missing, so the notes never block the release.
          if [[ -n "${base}" ]] && git rev-parse -q --verify "${base}^{commit}" > /dev/null; then
            max_commits=500
            count="$(git rev-list --count "${base}..${GITHUB_SHA}")"
            {
              echo
              echo "## ${heading} (${count})"
              echo
              git log --max-count="${max_commits}" --format="- [\`%h\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/%H) %s (%an)" "${base}..${GITHUB_SHA}"
              if (( count > max_commits )); then
                echo "- ...and $(( count - max_commits )) more."
              fi
              echo
              echo "Full comparison: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${compare}"
            } >> release-notes.md
          fi
          # The target commit is used by the editor to find the export templates matching its build.
          gh release create "${RELEASE_NAME}" release/* "${prerelease_flags[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_NAME}" \
            --notes-file release-notes.md
