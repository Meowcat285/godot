name: 🩹 Delta patches
on:
  # Runs once the main workflow has published a release, or a pre-release for other branches. This is a separate
  # workflow rather than a job of the main one so that new pushes, which cancel the main workflow, don't cancel
  # patch generation.
  workflow_run:
    workflows: ["🔗 GHA"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to generate delta patches for.
        type: string
        required: true
      history:
        description: Number of older releases to generate deltas from (ignored for pre-releases).
        type: number
        default: 2

# One group per release: a single group would keep only one pending run, canceling older pending ones,
# and the releases they were for would never get deltas. Runs for different releases don't share assets.
# A release that still misses its deltas can be backfilled by running this workflow by hand with its tag.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

# Generates the delta patches used by Meow Godot Launcher (https://github.com/Meowcat285/meow-godot-launcher)
# to update installed builds without downloading them in full, and uploads them as assets of the release.
jobs:
  delta-patches:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request') }}
    runs-on: ubuntu-24.04
    name: Generate delta patches
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - name: Find release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          PRERELEASE: ${{ github.event.workflow_run.head_branch != github.event.repository.default_branch }}
        run: |
          if [[ -n "${INPUT_TAG}" ]]; then
            tag="${INPUT_TAG}"
          else
            # The release job targets the commit it built. Several branches can be at the same commit, so pre-releases
            # are told apart by the run number ending their name (see `release-name` in runner.yml).
            tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.target_commitish == env.HEAD_SHA and (.prerelease | tostring) == env.PRERELEASE
                and ((.prerelease | not) or (.tag_name | endswith("." + env.RUN_NUMBER)))) | .tag_name' | head -n 1)"
          fi
          if [[ -z "${tag}" ]]; then
            echo "::notice::No release was published for ${HEAD_SHA}, nothing to do."
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.release.outputs.tag != ''
        uses: actions/checkout@v7
        with:
          sparse-checkout: misc/scripts

      - name: Set up Python
        if: steps.release.outputs.tag != ''
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Generate delta patches
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          HISTORY: ${{ inputs.history || 2 }}
        run: |
          # Deltas to pre-releases are made with xdelta3.
          sudo apt-get update -qq
          sudo apt-get install -y -qq xdelta3
          python -m pip install --require-hashes --only-binary :all: -r misc/scripts/delta_requirements.txt
          python misc/scripts/generate_delta_patches.py \
            --tag "${TAG}" \
            --history "${HISTORY}" \
            --work "${RUNNER_TEMP}/deltas" \
            --output delta-assets

      - name: Upload to release
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          ls -l delta-assets
          # Upload the manifest last, so the launcher never sees it before the deltas it lists.
          find delta-assets -name '*.mgdelta' -print0 | xargs -0 -r gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber
          gh release upload "${TAG}" delta-assets/meow-launcher-manifest.json --repo "${GITHUB_REPOSITORY}" --clobber
