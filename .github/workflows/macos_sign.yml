name: 🍎 macOS Signing
on:
  workflow_call:
    inputs:
      notarize:
        description: Notarize the signed app. Apple limits notarizations per day, so pre-releases are only signed.
        type: boolean
        default: true

# Signs and (unless disabled) notarizes the macOS editor app, then uploads it as the `macos-editor-mono-signed` artifact,
# which `misc/scripts/package_release.py` uses for the release instead of the unsigned app.
# Signing is skipped (and the release ships the unsigned app) when none of the secrets are set.
jobs:
  sign-macos:
    runs-on: macos-26
    name: Sign and notarize editor
    timeout-minutes: 60
    environment: macos-signing
    permissions:
      contents: read
    env:
      APP: ${{ github.workspace }}/signing/Godot_mono.app
      KEYCHAIN: ${{ github.workspace }}/signing/signing.keychain-db
      API_KEY: ${{ github.workspace }}/signing/api_key.p8
    steps:
      - name: Check secrets
        id: secrets
        env:
          SECRETS: >-
            ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
            ${{ secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
            ${{ secrets.APPLE_API_KEY_P8_BASE64 != '' }}
            ${{ secrets.APPLE_API_KEY_ID != '' }}
            ${{ secrets.APPLE_API_ISSUER_ID != '' }}
        run: |
          if [[ "${SECRETS}" == "true true true true true" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [[ "${SECRETS}" == "false false false false false" ]]; then
            echo "::notice::macOS signing secrets aren't set up, the release will contain the unsigned editor."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Only some of the macOS signing secrets are set (${SECRETS})."
            exit 1
          fi

      - name: Checkout
        if: steps.secrets.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        if: steps.secrets.outputs.enabled == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Download editor artifact
        if: steps.secrets.outputs.enabled == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-editor-mono
          path: artifacts/macos-editor-mono

      - name: Build app bundle
        if: steps.secrets.outputs.enabled == 'true'
        run: |
          mkdir -p signing
          python misc/scripts/package_release.py --artifacts artifacts --macos-editor-app "${APP}"
          # Artifacts lose their permissions when uploaded.
          chmod +x "${APP}/Contents/MacOS/Godot"

      - name: Import certificate
        if: steps.secrets.outputs.enabled == 'true'
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY || 'Developer ID Application' }}
        run: |
          keychain_password="$(uuidgen)"
          security create-keychain -p "${keychain_password}" "${KEYCHAIN}"
          security set-keychain-settings -lut 3600 "${KEYCHAIN}"
          security unlock-keychain -p "${keychain_password}" "${KEYCHAIN}"
          certificate="${RUNNER_TEMP}/certificate.p12"
          echo "${CERTIFICATE_P12_BASE64}" | base64 --decode > "${certificate}"
          security import "${certificate}" -k "${KEYCHAIN}" -P "${CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          rm -f "${certificate}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${KEYCHAIN}" > /dev/null
          # Add the keychain to the search list so codesign finds the certificate's chain.
          security list-keychains -d user -s "${KEYCHAIN}" $(security list-keychains -d user | tr -d '"')
          # A .p12 often holds only the leaf certificate, and the runner may lack Apple's Developer ID G2
          # intermediate, without which the identity isn't valid for signing.
          intermediate="${RUNNER_TEMP}/DeveloperIDG2CA.cer"
          curl -fsSL --retry 3 https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "${intermediate}"
          security import "${intermediate}" -k "${KEYCHAIN}" || true
          if ! security find-identity -v -p codesigning "${KEYCHAIN}" | grep -qF "${SIGNING_IDENTITY}"; then
            echo "::error::No valid \"${SIGNING_IDENTITY}\" identity in the imported certificate."
            security find-identity -p codesigning "${KEYCHAIN}"
            exit 1
          fi

      - name: Sign
        if: steps.secrets.outputs.enabled == 'true'
        env:
          SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY || 'Developer ID Application' }}
        run: |
          sign() {
            codesign --force --timestamp --options runtime --keychain "${KEYCHAIN}" --sign "${SIGNING_IDENTITY}" "$@"
          }
          # Nested code first (none is expected today, but notarization rejects any unsigned Mach-O),
          # then the app with the editor's entitlements.
          find "${APP}/Contents" -type f ! -path "${APP}/Contents/MacOS/Godot" -print0 |
            while IFS= read -r -d '' file; do
              if file -b "${file}" | grep -q "Mach-O"; then
                echo "Signing ${file}"
                sign "${file}"
              fi
            done
          sign --entitlements misc/dist/macos/editor.entitlements "${APP}"
          codesign --verify --strict --deep --verbose=2 "${APP}"

      - name: Notarize
        if: steps.secrets.outputs.enabled == 'true' && inputs.notarize
        env:
          API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          echo "${API_KEY_P8_BASE64}" | base64 --decode > "${API_KEY}"
          ditto -c -k --keepParent "${APP}" "${RUNNER_TEMP}/notarize.zip"
          xcrun notarytool submit "${RUNNER_TEMP}/notarize.zip" \
            --key "${API_KEY}" --key-id "${API_KEY_ID}" --issuer "${API_ISSUER_ID}" \
            --wait --timeout 45m --output-format json > "${RUNNER_TEMP}/notarize.json" || true
          cat "${RUNNER_TEMP}/notarize.json"
          id="$(python -c 'import json, sys; print(json.load(sys.stdin)["id"])' < "${RUNNER_TEMP}/notarize.json")"
          status="$(python -c 'import json, sys; print(json.load(sys.stdin)["status"])' < "${RUNNER_TEMP}/notarize.json")"
          if [[ "${status}" != "Accepted" ]]; then
            echo "::error::Notarization finished with status \"${status}\"."
            xcrun notarytool log "${id}" --key "${API_KEY}" --key-id "${API_KEY_ID}" --issuer "${API_ISSUER_ID}"
            exit 1
          fi
          xcrun stapler staple "${APP}"
          xcrun stapler validate "${APP}"
          spctl --assess --type execute --verbose=2 "${APP}"

      # `ditto` without resource forks or extended attributes, so the zip only holds regular files and
      # folders, which `misc/scripts/generate_delta_patches.py` and the launcher reproduce byte for byte.
      - name: Package signed app
        if: steps.secrets.outputs.enabled == 'true'
        run: |
          mkdir -p signed
          ditto -c -k --norsrc --noextattr --noacl --keepParent "${APP}" signed/Godot_mono.app.zip

      - name: Upload signed app
        if: steps.secrets.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-editor-mono-signed
          path: signed/Godot_mono.app.zip
          retention-days: 60

      - name: Clean up
        if: always() && steps.secrets.outputs.enabled == 'true'
        run: |
          security delete-keychain "${KEYCHAIN}" || true
          rm -f "${API_KEY}"
